    {n:'01',id:'intro',toc:'Introduction',h:'We take your privacy seriously',b:'<p>GrowthPILOT ("we") operates <strong>aigrowthpilot.app</strong>. This policy explains how we collect, use, and protect your data.</p><div class="highlight-box"><strong>Summary:</strong> We collect only what we need. We don\'t sell your data. You can request deletion at any time.</div>'},

    {n:'05',id:'social',toc:'Integraciones sociales',h:'LinkedIn, Threads, X & Instagram',b:'<ul><li>Tokens solo para acciones que solicitas</li><li>No leemos mensajes privados, contactos ni seguidores</li><li>Desconecta cualquier red en cualquier momento</li><li>Revocar acceso invalida nuestro token inmediatamente</li></ul><div class="highlight-box"><strong>Instagram:</strong> Usamos la API Instagram Graph de Meta. Al conectar, también aceptas los Términos de Meta.</div>'},

  de:{hero:'<span>Datenschutz</span>richtlinie',eff:'Gültig ab: <strong>15. Mai 2026</strong>',upd:'Aktualisiert: <strong>15. Mai 2026</strong>',toc:'INHALT',title:'Datenschutzrichtlinie — GrowthPILOT',s:[
    {n:'01',id:'intro',toc:'Einleitung',h:'Datenschutz liegt uns am Herzen',b:'<p>GrowthPILOT ("wir") betreibt <strong>aigrowthpilot.app</strong>. Diese Richtlinie erklärt, wie wir Ihre Daten erheben, verwenden und schützen.</p><div class="highlight-box"><strong>Kurzfassung:</strong> Wir erheben nur das Nötigste. Keine Datenweitergabe. Löschung jederzeit möglich.</div>'},
    {n:'02',id:'data',toc:'Erhobene Daten',h:'Welche Daten erheben wir?',b:'<ul><li><strong>Konto:</strong> E-Mail, Passwort (gehasht), Profil</li><li><strong>Inhalte:</strong> Posts, Projekte, Brand Memory, Kalender</li><li><strong>Social-Tokens:</strong> OAuth für LinkedIn, Threads, X — verschlüsselt</li><li><strong>Nutzung:</strong> KI-Generierungen, Funktionen</li><li><strong>Zahlungen:</strong> über Stripe — keine Bankdaten gespeichert</li><li><strong>Technisch:</strong> IP, Browser, Zugriffsprotokolle</li></ul>'},
    {n:'03',id:'use',toc:'Datennutzung',h:'Wie nutzen wir Ihre Daten?',b:'<ul><li>GrowthPILOT bereitstellen und verbessern</li><li>KI-Inhalte passend zu Ihrer Markenstimme erstellen</li><li>Inhalte auf verbundenen Plattformen veröffentlichen</li><li>Zahlungen über Stripe verarbeiten</li><li>Transaktions-E-Mails senden</li><li>Gesetzliche Pflichten erfüllen</li></ul><div class="highlight-box"><strong>Wir verkaufen keine Daten</strong> und nutzen Ihre Inhalte nicht ohne Zustimmung für KI-Training.</div>'},
    {n:'04',id:'third',toc:'Drittanbieter',h:'Drittanbieter-Dienste',b:'<ul><li><strong>OpenAI</strong> — KI-Generierung</li><li><strong>Anthropic</strong> — KI-Generierung</li><li><strong>Stripe</strong> — Zahlungen</li><li><strong>Resend</strong> — E-Mails</li><li><strong>Railway</strong> — Infrastruktur</li><li><strong>Vercel</strong> — Hosting</li></ul>'},
    {n:'05',id:'social',toc:'Social-Integrationen',h:'LinkedIn, Threads, X & Instagram',b:'<ul><li>Tokens nur für ausdrücklich angeforderte Aktionen</li><li>Keine privaten Nachrichten oder Kontakte gelesen</li><li>Soziale Netzwerke jederzeit trennen</li><li>Zugriffsentzug macht Token sofort ungültig</li></ul><div class="highlight-box"><strong>Instagram:</strong> Wir nutzen die Meta Instagram Graph API. Durch Verbindung stimmen Sie auch Metas Bedingungen zu.</div>'},
    {n:'06',id:'security',toc:'Datensicherheit',h:'Wie schützen wir Ihre Daten?',b:'<ul><li>HTTPS/TLS-Verschlüsselung</li><li>Passwörter mit bcrypt gehasht</li><li>OAuth-Tokens verschlüsselt</li><li>JWT mit Ablaufzeit</li><li>Regelmäßige Backups</li></ul>'},
    {n:'07',id:'retention',toc:'Datenspeicherung',h:'Speicherdauer Ihrer Daten',b:'<ul><li><strong>Konto:</strong> solange aktiv</li><li><strong>Inhalte:</strong> bis zur Löschung oder Kontoschließung</li><li><strong>Tokens:</strong> sofort bei Trennung gelöscht</li><li><strong>Zahlungen:</strong> 7 Jahre (gesetzlich)</li><li><strong>Logs:</strong> 90 Tage</li></ul>'},
    {n:'08',id:'rights',toc:'Ihre Rechte',h:'Ihre Rechte (DSGVO u. a.)',b:'<ul><li><strong>Auskunft:</strong> Kopie Ihrer Daten</li><li><strong>Berichtigung:</strong> Daten korrigieren</li><li><strong>Löschung:</strong> Konto und Daten entfernen</li><li><strong>Portabilität:</strong> maschinenlesbar</li><li><strong>Widerspruch:</strong> Marketing-Verarbeitung</li></ul><p>Kontakt: <a href="mailto:team@aigrowthpilot.app" style="color:#ef4444">team@aigrowthpilot.app</a> — Antwort innerhalb 30 Tagen.</p>'},
    {n:'09',id:'cookies',toc:'Cookies',h:'Cookies und lokaler Speicher',b:'<p>GrowthPILOT verwendet LocalStorage (keine Cookies) für Auth-Token, Spracheinstellung und Onboarding-Status. Kein Werbe-Tracking.</p>'},
    {n:'10',id:'children',toc:'Minderjährige',h:'Kinder unter 16 Jahren',b:'<p>GrowthPILOT richtet sich nicht an Kinder unter 16. Wir erheben wissentlich keine Daten von Minderjährigen.</p>'},
    {n:'11',id:'changes',toc:'Änderungen',h:'Aktualisierungen',b:'<p>Wir können diese Richtlinie aktualisieren. Bei wesentlichen Änderungen informieren wir per E-Mail oder In-App.</p>'},
    {n:'12',id:'contact',toc:'Kontakt',h:'Kontaktieren Sie uns',b:'<div class="contact-card"><div class="label">E-MAIL</div><a href="mailto:team@aigrowthpilot.app">team@aigrowthpilot.app</a><div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)"><div class="label">WEBSITE</div><a href="https://www.aigrowthpilot.app">www.aigrowthpilot.app</a></div></div>'},
  ]},
  it:{hero:'Informativa sulla <span>Privacy</span>',eff:'In vigore dal: <strong>15 maggio 2026</strong>',upd:'Aggiornato: <strong>15 maggio 2026</strong>',toc:'INDICE',title:'Informativa sulla Privacy — GrowthPILOT',s:[
    {n:'01',id:'intro',toc:'Introduzione',h:'La tua privacy è importante',b:'<p>GrowthPILOT ("noi") gestisce <strong>aigrowthpilot.app</strong>. Questa informativa spiega come raccogliamo, utilizziamo e proteggiamo i tuoi dati.</p><div class="highlight-box"><strong>In breve:</strong> Raccogliamo solo lo stretto necessario. Non vendiamo dati. Puoi richiedere la cancellazione in qualsiasi momento.</div>'},
    {n:'02',id:'data',toc:'Dati raccolti',h:'Quali informazioni raccogliamo?',b:'<ul><li><strong>Account:</strong> email, password (hash), profilo</li><li><strong>Contenuti:</strong> post, progetti, Brand Memory, calendario</li><li><strong>Token social:</strong> OAuth per LinkedIn, Threads, X — cifrati</li><li><strong>Utilizzo:</strong> generazioni IA, funzionalità usate</li><li><strong>Pagamenti:</strong> gestiti da Stripe — mai dati bancari</li><li><strong>Tecnici:</strong> IP, browser, log di accesso</li></ul>'},
    {n:'03',id:'use',toc:'Utilizzo dati',h:'Come utilizziamo i tuoi dati?',b:'<ul><li>Fornire e migliorare GrowthPILOT</li><li>Generare contenuti IA per il tuo brand</li><li>Pubblicare sui social collegati</li><li>Elaborare pagamenti via Stripe</li><li>Inviare email transazionali</li><li>Rispettare obblighi legali</li></ul><div class="highlight-box"><strong>Non vendiamo i tuoi dati</strong> né usiamo i tuoi contenuti per addestrare IA senza consenso.</div>'},
    {n:'04',id:'third',toc:'Servizi terzi',h:'Servizi di terze parti',b:'<ul><li><strong>OpenAI</strong> — Generazione IA</li><li><strong>Anthropic</strong> — Generazione IA</li><li><strong>Stripe</strong> — Pagamenti</li><li><strong>Resend</strong> — Email</li><li><strong>Railway</strong> — Infrastruttura</li><li><strong>Vercel</strong> — Hosting</li></ul>'},
    {n:'05',id:'social',toc:'Integrazioni social',h:'LinkedIn, Threads, X & Instagram',b:'<ul><li>Token usati solo per azioni che richiedi</li><li>Non leggiamo messaggi privati, contatti o follower</li><li>Disconnetti qualsiasi social in qualsiasi momento</li><li>Revocare l\'accesso invalida immediatamente il token</li></ul><div class="highlight-box"><strong>Instagram:</strong> Usiamo l\'API Instagram Graph di Meta. Collegando il tuo account, accetti anche i Termini di Meta.</div>'},
    {n:'06',id:'security',toc:'Sicurezza',h:'Come proteggiamo i tuoi dati?',b:'<ul><li>HTTPS/TLS su tutte le trasmissioni</li><li>Password con hash bcrypt</li><li>Token OAuth cifrati</li><li>JWT con scadenza</li><li>Backup regolari</li></ul>'},
    {n:'07',id:'retention',toc:'Conservazione',h:'Per quanto tempo conserviamo i dati?',b:'<ul><li><strong>Account:</strong> finché attivo</li><li><strong>Contenuti:</strong> fino all\'eliminazione</li><li><strong>Token:</strong> eliminati alla disconnessione</li><li><strong>Pagamenti:</strong> 7 anni (legge)</li><li><strong>Log:</strong> 90 giorni</li></ul>'},
    {n:'08',id:'rights',toc:'I tuoi diritti',h:'I tuoi diritti (GDPR e altri)',b:'<ul><li><strong>Accesso:</strong> copia dei dati</li><li><strong>Rettifica:</strong> correggere dati</li><li><strong>Cancellazione:</strong> eliminare account e dati</li><li><strong>Portabilità:</strong> formato leggibile</li><li><strong>Opposizione:</strong> marketing</li></ul><p>Contatta <a href="mailto:team@aigrowthpilot.app" style="color:#ef4444">team@aigrowthpilot.app</a> — rispondiamo entro 30 giorni.</p>'},
    {n:'09',id:'cookies',toc:'Cookie',h:'Cookie e archiviazione locale',b:'<p>GrowthPILOT usa il localStorage (non cookie) per token di autenticazione, lingua e onboarding. Nessun cookie pubblicitario.</p>'},
    {n:'10',id:'children',toc:'Minori',h:'Bambini sotto i 16 anni',b:'<p>GrowthPILOT non è rivolto a minori di 16 anni. Non raccogliamo dati di minori consapevolmente.</p>'},
    {n:'11',id:'changes',toc:'Modifiche',h:'Aggiornamenti a questa informativa',b:'<p>Potremmo aggiornare questa informativa. Per modifiche importanti, ti notificheremo via email o in-app.</p>'},
    {n:'12',id:'contact',toc:'Contatti',h:'Contattaci',b:'<div class="contact-card"><div class="label">EMAIL</div><a href="mailto:team@aigrowthpilot.app">team@aigrowthpilot.app</a><div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)"><div class="label">SITO</div><a href="https://www.aigrowthpilot.app">www.aigrowthpilot.app</a></div></div>'},
  ]},
  pt:{hero:'Política de <span>Privacidade</span>',eff:'Vigente desde: <strong>15 de maio de 2026</strong>',upd:'Atualizado: <strong>15 de maio de 2026</strong>',toc:'CONTEÚDO',title:'Política de Privacidade — GrowthPILOT',s:[
    {n:'01',id:'intro',toc:'Introdução',h:'Levamos sua privacidade a sério',b:'<p>GrowthPILOT ("nós") opera <strong>aigrowthpilot.app</strong>. Esta política explica como coletamos, usamos e protegemos seus dados.</p><div class="highlight-box"><strong>Resumo:</strong> Coletamos apenas o necessário. Não vendemos dados. Você pode solicitar exclusão a qualquer momento.</div>'},
    {n:'02',id:'data',toc:'Dados coletados',h:'Quais informações coletamos?',b:'<ul><li><strong>Conta:</strong> e-mail, senha (hash), perfil</li><li><strong>Conteúdo:</strong> posts, projetos, Brand Memory, calendário</li><li><strong>Tokens sociais:</strong> OAuth para LinkedIn, Threads, X — criptografados</li><li><strong>Uso:</strong> gerações IA, funcionalidades</li><li><strong>Pagamentos:</strong> via Stripe — nunca armazenamos dados bancários</li><li><strong>Técnicos:</strong> IP, navegador, logs</li></ul>'},
    {n:'03',id:'use',toc:'Uso dos dados',h:'Como usamos suas informações?',b:'<ul><li>Fornecer e melhorar o GrowthPILOT</li><li>Gerar conteúdo IA para sua marca</li><li>Publicar nas redes sociais conectadas</li><li>Processar pagamentos via Stripe</li><li>Enviar e-mails transacionais</li><li>Cumprir obrigações legais</li></ul><div class="highlight-box"><strong>Não vendemos seus dados</strong> nem usamos seu conteúdo para treinar IA sem consentimento.</div>'},
    {n:'04',id:'third',toc:'Serviços terceiros',h:'Serviços de terceiros',b:'<ul><li><strong>OpenAI</strong> — Geração IA</li><li><strong>Anthropic</strong> — Geração IA</li><li><strong>Stripe</strong> — Pagamentos</li><li><strong>Resend</strong> — E-mails</li><li><strong>Railway</strong> — Infraestrutura</li><li><strong>Vercel</strong> — Hosting</li></ul>'},
    {n:'05',id:'social',toc:'Integrações sociais',h:'LinkedIn, Threads, X & Instagram',b:'<ul><li>Tokens apenas para ações que você solicita</li><li>Não lemos mensagens privadas, contatos ou seguidores</li><li>Desconecte qualquer rede a qualquer momento</li><li>Revogar acesso invalida nosso token imediatamente</li></ul><div class="highlight-box"><strong>Instagram:</strong> Usamos a API Instagram Graph da Meta. Ao conectar, você também aceita os Termos da Meta.</div>'},
    {n:'06',id:'security',toc:'Segurança',h:'Como protegemos seus dados?',b:'<ul><li>HTTPS/TLS em todas as transmissões</li><li>Senhas com hash bcrypt</li><li>Tokens OAuth criptografados</li><li>JWT com expiração</li><li>Backups regulares</li></ul>'},
    {n:'07',id:'retention',toc:'Retenção',h:'Por quanto tempo mantemos seus dados?',b:'<ul><li><strong>Conta:</strong> enquanto ativa</li><li><strong>Conteúdo:</strong> até excluir ou encerrar</li><li><strong>Tokens:</strong> excluídos ao desconectar</li><li><strong>Pagamentos:</strong> 7 anos (legal)</li><li><strong>Logs:</strong> 90 dias</li></ul>'},
    {n:'08',id:'rights',toc:'Seus direitos',h:'Seus direitos (LGPD, GDPR e outros)',b:'<ul><li><strong>Acesso:</strong> cópia dos dados</li><li><strong>Retificação:</strong> corrigir dados</li><li><strong>Exclusão:</strong> remover conta e dados</li><li><strong>Portabilidade:</strong> formato legível</li><li><strong>Oposição:</strong> marketing</li></ul><p>Contate <a href="mailto:team@aigrowthpilot.app" style="color:#ef4444">team@aigrowthpilot.app</a> — respondemos em 30 dias.</p>'},
    {n:'09',id:'cookies',toc:'Cookies',h:'Cookies e armazenamento local',b:'<p>GrowthPILOT usa localStorage (não cookies) para token de auth, idioma e onboarding. Sem cookies de rastreamento publicitário.</p>'},
    {n:'10',id:'children',toc:'Menores',h:'Crianças menores de 16 anos',b:'<p>GrowthPILOT não é direcionado a menores de 16 anos. Não coletamos dados de menores conscientemente.</p>'},
    {n:'11',id:'changes',toc:'Alterações',h:'Atualizações desta política',b:'<p>Podemos atualizar esta política. Notificaremos mudanças importantes por e-mail ou notificação no app.</p>'},
    {n:'12',id:'contact',toc:'Contato',h:'Entre em contato',b:'<div class="contact-card"><div class="label">E-MAIL</div><a href="mailto:team@aigrowthpilot.app">team@aigrowthpilot.app</a><div style="margin-top:16px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.06)"><div class="label">SITE</div><a href="https://www.aigrowthpilot.app">www.aigrowthpilot.app</a></div></div>'},
  ]},
};

function render(lang) {
  const t = T[lang] || T.en;
  document.getElementById('hero-title').innerHTML   = t.hero;
  document.getElementById('meta-effective').innerHTML = t.eff;
  document.getElementById('meta-updated').innerHTML   = t.upd;
  document.getElementById('toc-title').textContent    = t.toc;
  document.title = t.title;
  document.documentElement.lang = lang;
  document.getElementById('toc-links').innerHTML = t.s.map(s=>`<a href="#${s.id}">${s.toc}</a>`).join('');
  document.getElementById('main-content').innerHTML = t.s.map(s=>`
    <div class="section" id="${s.id}">
      <div class="section-num">${s.n}</div>
      <h2>${s.h}</h2>
      ${s.b}
    </div>`).join('');
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === lang.toUpperCase()));
}

function setLang(lang) {
  try { localStorage.setItem('gp_lang', lang); } catch {}
  render(lang);
}

(function init() {
  let lang = 'en';
  try { const s = localStorage.getItem('gp_lang'); if (s && T[s]) lang = s; } catch {}
  render(lang);
})();
</script>
