<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ── SEO Core ── -->
    <title>GrowthPILOT — AI Content Platform for Founders & Creators</title>

    <meta name="robots" content="index, follow" />

    <!-- ── Open Graph (Facebook, LinkedIn preview) ── -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aigrowthpilot.app/" />
    <meta property="og:site_name" content="GrowthPILOT" />
    <meta property="og:title" content="GrowthPILOT — AI Content Platform for Founders & Creators" />

    <!-- ── Twitter Card ── -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@growthpilot" />
    <meta name="twitter:title" content="GrowthPILOT — AI Content Platform for Founders & Creators" />
    <meta name="twitter:description" content="Generate, schedule and publish authority content on LinkedIn, Threads, X and more. AI-powered brand memory, viral trend detection." />
    <meta name="twitter:image" content="https://aigrowthpilot.app/og-image.png" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "GrowthPILOT",
          "url": "https://www.aigrowthpilot.app",
          "logo": "https://www.aigrowthpilot.app/logo.png",
          "description": "AI-powered multi-platform content OS for founders and creators. Generate, schedule and publish authority content across LinkedIn, X, Threads, Facebook, Instagram and TikTok.",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "inLanguage": ["en", "fr", "es", "de", "it", "pt"],
          "offers": [
            { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "EUR", "description": "5 AI generations per month" },
            { "@type": "Offer", "name": "Pro", "price": "19", "priceCurrency": "EUR", "description": "100 AI generations, Brand Memory, multi-format repurpose" },
            { "@type": "Offer", "name": "Business", "price": "49", "priceCurrency": "EUR", "description": "Unlimited generations, 5 team members" },
            { "@type": "Offer", "name": "Agency", "price": "99", "priceCurrency": "EUR", "description": "50 client accounts, MRR tracking, PDF invoices" }
          ],
          "featureList": [
            "Multi-platform publishing (LinkedIn, X, Threads, Facebook, Instagram, TikTok)",
            "AI content generation with viral score",
            "Brand Memory AI",
            "Real-time trend radar",
            "Carousel generator",
            "GhostWrite",
            "Agency mode with client billing",
            "6 languages supported"
          ],
          "creator": {
            "@type": "Person",
            "name": "Azzedine Ramdani",
            "url": "https://www.aigrowthpilot.app"
          }
        },
        {
          "@type": "WebSite",
          "name": "GrowthPILOT",
          "url": "https://www.aigrowthpilot.app",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://www.aigrowthpilot.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What makes GrowthPILOT different from Taplio or Supergrow?",
              "acceptedAnswer": { "@type": "Answer", "text": "GrowthPILOT is the only tool that publishes directly to 6 platforms: LinkedIn, X, Threads, Instagram, Facebook and TikTok. Every competitor is LinkedIn-only." }
            },
            {
              "@type": "Question",
              "name": "Is there a free plan?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. The free plan includes 5 AI generations per month, 1 project, and basic analytics. No credit card required." }
            },
            {
              "@type": "Question",
              "name": "Does the AI learn my writing style?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. Brand Memory lets you define your niche, tone, audience, CTA and banned words. Voice Learning analyzes your past posts to match your exact writing style." }
            }
          ]
        }
      ]
    }
    </script>


    <!-- ── PWA ── -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ef4444" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GrowthPILOT" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- ── Service Worker PWA ── -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js")
            .then((reg) => console.log("SW registered:", reg.scope))
            .catch((err) => console.error("SW error:", err));
        });
      }
    </script>
  </body>
</html>
